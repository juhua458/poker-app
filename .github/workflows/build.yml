name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.128
        name: "V2.9.128 按池人数自适应——5-max 多人池剥削规则落地"
        body: "V2.9.128: 按池人数自适应（5-max 多人池剥削规则落地）。原V2.9.126池子驱动框架是矩阵空架，本版按G.act（实际池人数）填入具体剥削规则：5+人池0%bluff+25%pot Cbet+河牌绝不bluff+被raise直接弃；4人池10%bluff+25%pot Cbet+禁止hero call；3人池20%bluff+33%pot Cbet+保留hero call。HeroCallGate按G.act细分（5+/4人池禁止，3人池保留V2.9.126原行为）。V2.9.123/125/126/127所有保护点100%保留。E2E 10/10 PASS。"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
