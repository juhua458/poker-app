name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.129
        name: "V2.9.129 自己Tilt早期预警——4档状态机+命名空间隔离"
        body: "V2.9.129: 自己Tilt早期预警。V2.9.60 TiltDetector是检测对手Tilt给策略，V2.9.129 SelfTiltGuard是检测自己Tilt给警告，两层命名空间隔离。4档状态机：NORMAL/WARNING/DANGER/TILT。3个核心信号：亏损速度(亏100BB/150BB)、决策时间(<2秒连点3+/5+次)、翻前弃牌率(相对基线1.3/1.5倍)+报复模式(亏5+BB后两手全被动)。呈现：通知栏🟡/🟠/🔴+result.r前缀[⚠️DANGER]/[🔥TILT]+软横幅(建议暂停5分钟/立刻停止20分钟)。硬约束：7色悬浮球不动，V2.9.127顶级牌保护不动，V2.9.126池驱反fold不动。E2E 33/33+回归64/64 PASS。"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
