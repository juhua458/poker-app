; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.15
; ============================================================================
; v1.0.15：禁用 USB CDC，解决 USB HID NOT MOUNTED 问题
;   - 根因：USB Serial/JTAG（CDC）与 USB-OTG（TinyUSB HID）共享USB PHY，
;     同时激活导致复合设备枚举失败，手机无法识别HID接口
;   - 修复：显式禁用 ARDUINO_USB_CDC_ON_BOOT，使设备成为纯 HID 设备
;   - 调试：串口改用WiFi HTTP状态端点（http://192.168.4.1/status）

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
