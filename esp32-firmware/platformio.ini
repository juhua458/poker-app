; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.12
; ============================================================================
; v1.0.12：用 USBHIDDevice 模式实现自定义 HID 触控（遵循官方 USBHIDKeyboard 模式）
;   - 启用 CONFIG_TINYUSB_HID_ENABLED（USBHID.h 必需）
;   - 保持 QIO OPI PSRAM + WiFi AP + HTTP 服务器

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-Os
build_src_filter =
	+<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
