name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/pokerhelper_v1.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: poker-debug
        path: app/build/outputs/apk/debug/pokerhelper_v1.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0
        name: "V1.0 扑克AI助手 v1.0"
        body: "V1.0: 德州扑克AI辅助App，集成v13策略引擎，支持选牌、场景选择、胜率计算。"
        files: app/build/outputs/apk/debug/pokerhelper_v1.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
