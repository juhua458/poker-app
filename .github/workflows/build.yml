name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug 2>&1
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.2
        name: "V2.9.2 牌局智囊 - 🎯无背景+topBar紧凑+建议放大"
        body: "V2.9.2: 🎯截图按钮彻底无背景透明|topBar绿色条缩小padding|所有按钮emoji无背景|建议文字42px大字醒目|动作18px小标签+5色变色|版本号清晰可辨"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
