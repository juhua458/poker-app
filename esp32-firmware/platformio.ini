; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.18
; ============================================================================
; v1.0.18：全链路 USB debug 诊断固件
;   - CORE_DEBUG_LEVEL=3 输出 TinyUSB 层 debug 日志
;   - USB PHY 寄存器状态读取 + USB operator bool 检测
;   - USB 事件回调（mount/unmount/suspend/resume）
;   - USB mount 等待延长至 30 秒
; v1.0.16：按Freenove官方文档修正USB-OTG配置(MODE=0, CDC=0)

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
