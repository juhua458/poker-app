name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.133
        name: "V2.9.133 崩溃「崩」悬浮球提示——命名空间污染3 bug全修+notifyCrash 4Hz红闪+用户原话:崩了能不能显示在悬浮球"
        body: "V2.9.133 修复实战崩溃:
  - Bug A: HandClassifier isFlush2 把 suit=空字符串误判同花(假 flush → NUTS)
  - Bug B: ProbeStrategy.isProbeSpot 内部用 hClass 但签名漏接(V2.9.130 改造漏改)
  - Bug C: postF L6496 引用未声明全局 cbetThresh → ReferenceError
  - Bug D: onVisionResult 切桌 BB 未重置, rawBB 从 200 跳 500
  - 新增 notifyCrash(reason) + renderCrashBall: 任何 ReferenceError/未捕获异常 → 悬浮球立即变「崩」+红+4Hz 快闪, 用户能立刻知道崩溃+停止游戏
  - 用户原话:「崩了能不能显示在悬浮球, 这样我就不会在崩溃的情况下, 还在游戏中」
  - V2.9.132 字为王 + V2.9.131 桌质/换桌闪烁 + V2.9.130 HandClassifier + V2.9.129 SelfTiltGuard 100% 保留
  - E2E V2.9.132 ≥20 + 实战 16 场景 PASS (REF_ERR=0)"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
