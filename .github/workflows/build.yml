name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug 2>&1
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.5
        name: "V2.9.5 牌局智囊 - 回退V2.8经典加载方式修复黑屏"
        body: "V2.9.5: 回退V2.8经典loadUrl加载方式|about:blank和loadDataWithBaseURL方案均导致黑屏|V2.8的loadUrl+onReceivedError重试方案经过验证稳定|保留executeJs队列+V2.9.x UI改进"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
