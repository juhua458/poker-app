name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.130
        name: "V2.9.130 手牌历史自动归类——4维复盘金矿（结果+牌力+决策+关键街）"
        body: "V2.9.130: 手牌历史自动归类。每手牌按 4 维自动分类: RESULT(结果WIN_BIG/WIN_SMALL/CHOP/LOSE_SMALL/LOSE_BIG) + TYPE(牌力PREMIUM/STRONG/MEDIUM/WEAK) + DECISION(决策质量GOOD/OK/MISTAKE/BLUNDER) + STREET(关键街preflop/flop/turn/river)。MISTAKE 检测: 河牌 80%+ 胜率弃牌/河牌 60-80% 弃牌/转牌 70%+ 弃牌/强手弃牌+输钱/顶级牌翻前 limp。复盘弹窗: 顶部 Session 概览(总手数/BB/100/胜率) + 中部结果分布 + 下部牌力 BB/100 对比 + 决策质量 + 底部 Top10 弱手 + MISTAKE 列表。每 20 手小提示复盘。命名空间隔离: 不动 result.r / 通知栏 / 7色悬浮球, 不动 V2.9.129 SelfTiltGuard。SessionStats.reset 联动 HandClassifier.reset。E2E ≥20 断言 + 4 套回归(V2.9.129/128/127/126) 80+ PASS。"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
