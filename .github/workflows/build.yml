name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.132
        name: "V2.9.132 7色策略色保留+字为王——悬浮球动作字18f加粗,EQ小字(0.5x)在上,颜色作情绪字作决策"
        body: "V2.9.132: 字为王色为辅(用户原话:「悬浮球里有字, 就什么都清楚, 比如弃呀, 有一个字就可以了」)。保留 V2.9.63 7色策略色硬约束(🔴红=弃 🟠深橙=弱跟 🟡黄=跟 🟢绿=加 💚青绿=重锤 🟣紫=全押 ⚪灰=过)不动, 只把悬浮球文字排版升级: 动作字 18f 加粗居中(Typeface.DEFAULT_BOLD), EQ% 用 SpannableString + RelativeSizeSpan 0.5x 缩小到上方, 允许两行(setSingleLine(false)+setLineSpacing(0,0.85)), V2.9.132 抽 setBallText(ball, action, eqText) 集中管理。新增 import android.text.SpannableString / Spanned / style.RelativeSizeSpan / android.graphics.Typeface。V2.9.131 桌质评估+换桌闪烁+V2.9.130 HandClassifier+V2.9.129 SelfTiltGuard+V2.9.128 PoolStrategyMatrix+V2.9.127 顶级保护+V2.9.126 池驱反 fold 100% 保留。E2E V2.9.132 ≥20 + 7 套回归(V2.9.131/130/129/128/127/126集成/翻前) 200+ PASS。"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
