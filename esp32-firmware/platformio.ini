; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.9
; ============================================================================
; v1.0.9 关键变更（基于 Freenove C_Tutorial.pdf 官方资料 + 社区验证）：
;   1. 移除 ARDUINO_USB_CDC_ON_BOOT（框架初始化阶段USB CDC导致abort）
;   2. 移除 ARDUINO_USB_MODE=1（不强制USB模式，走CH343串口调试）
;   3. 移除 TinyUSB 依赖（静态初始化可能冲突）
;   4. 使用 default_16MB.csv 分区表（替代自定义partitions.csv）
;   5. build_src_filter 只编译 main.cpp（最小化冲突面）
;   6. 禁用 brownout detector（防止上电瞬间电压波动触发复位）
;   7. 保持 espressif32@6.2.0（Arduino core 2.0.8）
;   8. Flash 模式 dio（匹配 bootloader 报告的 mode:DIO）

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags = 
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DBROWNOUT_DET_LVL=0
	-Os
build_src_filter = 
	+<main.cpp>
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
