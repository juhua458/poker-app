name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build and Find APK
      run: |
        chmod +x gradlew
        echo "=== Building APK ==="
        ./gradlew assembleDebug 2>&1
        echo ""
        echo "=== Searching for APK ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "find returned nothing"
        echo ""
        echo "=== Build outputs directory ==="
        ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"
        
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.2
        name: "V1.2 扑克AI助手 - OCR+语音+信号"
        body: "V1.2: ML Kit OCR筹码识别 + 语音输入牌面 + 颜色信号模式 + 筹码变化追踪"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
