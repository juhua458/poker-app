name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.126
        name: "V2.9.126 池子驱动策略引擎——什么池子打什么牌(4模块+反fold接入decide)"
        body: "V2.9.126: 池子驱动策略引擎——4模块(PTD/VTA/PSM/HCG)+池驱反fold接入decide()。小牌打赢/大牌打稳。V2.9.125所有保护点(EV护栏/纠错/顶级保护)100%保留。"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
