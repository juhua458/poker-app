; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.10
; ============================================================================
; v1.0.10 关键变更（基于 v1.0.9 平台验证成功 + Freenove C_Tutorial.pdf）：
;   1. 加回 PSRAM OPI 配置（memory_type=qio_opi, flash_mode=qio, psram_type=opi）
;   2. 移除 USB CDC / TinyUSB（v1.0.9已验证走CH343串口可正常启动）
;   3. 只编译 main.cpp + 禁用 brownout + default_16MB.csv（保持v1.0.9）
;   4. espressif32@6.2.0 + Arduino core 2.0.8（v1.0.9已验证可启动）

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DBROWNOUT_DET_LVL=0
	-Os
build_src_filter = 
	+<main.cpp>
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
