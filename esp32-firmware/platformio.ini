; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.17
; ============================================================================
; v1.0.17：修复HID NOT MOUNTED——调整touchpad.begin()与USB.begin()调用顺序
;   - 根因：v1.0.16先USB.begin()启动TinyUSB栈(tinyusb_is_initialized=true)，
;     后touchpad.begin()→tinyusb_enable_interface(HID)被拒绝(ESP_FAIL)
;   - 修复：先touchpad.begin()注册HID接口，再USB.begin()启动TinyUSB
;   - 依据：arduino-esp32 v2.0.14 esp32-hal-tinyusb.c源码 + Freenove官方示例顺序
; v1.0.16：按Freenove官方文档修正USB-OTG配置(MODE=0, CDC=0)

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
