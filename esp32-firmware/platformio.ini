; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.16
; ============================================================================
; v1.0.16：按Freenove官方文档修正USB-OTG配置
;   - 根因：v1.0.15只禁了CDC(ARDUINO_USB_CDC_ON_BOOT=0)，但未设置USB模式
;     esp32-s3-devkitc-1板定义默认ARDUINO_USB_MODE=1(CDC/JTAG)，
;     TinyUSB HID要求ARDUINO_USB_MODE=0(USB-OTG模式)
;   - 修复依据：Freenove官方USB教程所有HID示例均要求
;     (1) Arduino IDE Tools → USB CDC On Boot: Disabled
;     (2) Keyboard/ConsumerControl示例显式 #define ARDUINO_USB_MODE 0
;   - PlatformIO对应：build_unflags移除默认的MODE=1，再设MODE=0
;   - 调试：串口走UART(GPIO43/44)，USB调试走WiFi HTTP端点

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
