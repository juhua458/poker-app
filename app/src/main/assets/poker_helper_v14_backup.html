<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>扑克AI v2.9.17 · GTO+DRTA融合版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#080e08;color:#fff;min-height:100vh;padding:3px;max-width:500px;margin:0 auto;user-select:none;font-size:12px}
body.speed-mode{max-width:none;background:transparent;min-height:auto}
.res{background:linear-gradient(135deg,#0f1b2e,#16213e);border-radius:14px;padding:12px;text-align:center;margin-bottom:4px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.r-a{font-size:60px;font-weight:900;letter-spacing:3px;line-height:1}
.r-a.raise{color:#2ed573;text-shadow:0 0 25px rgba(46,213,115,.6)}
.r-a.call{color:#ffa502;text-shadow:0 0 25px rgba(255,165,2,.6)}
.r-a.fold{color:#ff4757;text-shadow:0 0 25px rgba(255,71,87,.6)}
.r-a.check{color:#aaa}
.r-a.allin{color:#a855f7;text-shadow:0 0 25px rgba(168,85,247,.6)}
.r-v{font-size:22px;color:#ccc;margin-top:2px;font-weight:bold}
.r-d{font-size:11px;color:#888;margin-top:2px;line-height:1.4}
.r-tip{font-size:10px;color:#2ed573;margin-top:4px;font-weight:bold;padding:3px 12px;background:rgba(46,213,115,.1);border-radius:20px;display:inline-block}
body.speed-mode .r-tip.fold-tip{color:#ff4757;background:rgba(255,71,87,.12)}
body.speed-mode .r-tip.call-tip{color:#ffa502;background:rgba(255,165,2,.12)}
body.speed-mode .r-tip.raise-tip{color:#2ed573;background:rgba(46,213,115,.12)}
body.speed-mode .r-tip.check-tip{color:#aaa;background:rgba(170,170,170,.1)}
body.speed-mode .r-tip.allin-tip{color:#c77dff;background:rgba(168,85,247,.12)}
.r-exploit{font-size:9px;padding:2px 8px;border-radius:10px;margin-top:3px;display:inline-block}
.r-exploit.fish{background:rgba(46,213,115,.15);color:#2ed573}
.r-exploit.tp{background:rgba(93,173,226,.15);color:#5dade2}
.r-exploit.lag{background:rgba(255,71,87,.15);color:#ff6b7a}
.r-exploit.maniac{background:rgba(200,50,150,.15);color:#c83296}
.r-exploit.calling_station{background:rgba(100,180,220,.15);color:#64b4dc}
.r-exploit.nit{background:rgba(180,180,50,.15);color:#b4b432}
.r-drta{font-size:9px;padding:2px 8px;border-radius:8px;margin-top:3px;display:inline-block;background:rgba(199,125,255,.15);color:#c77dff}
.r-plan{font-size:9px;color:#c77dff;margin-top:3px;padding:2px 8px;background:rgba(199,125,255,.1);border-radius:8px;display:inline-block}
.r-ev-sm{font-size:10px;color:#555;margin-top:3px}
.r-spr{font-size:9px;padding:2px 6px;border-radius:3px;margin-top:2px;display:inline-block}
.r-spr.lo{background:rgba(255,71,87,.15);color:#ff4757}
.r-spr.md{background:rgba(255,215,0,.15);color:#ffd700}
.r-spr.hi{background:rgba(46,213,115,.15);color:#2ed573}
.r-class{font-size:8px;padding:2px 6px;border-radius:10px;margin-top:2px;display:inline-block}
.r-class.nuts{background:rgba(168,85,247,.2);color:#c77dff}
.r-class.strong{background:rgba(46,213,115,.2);color:#2ed573}
.r-class.medium{background:rgba(255,215,0,.2);color:#ffd700}
.r-class.weak{background:rgba(255,71,87,.2);color:#ff6b6b}
.r-class.draw{background:rgba(93,173,226,.2);color:#5dade2}
.r-class.air{background:rgba(100,100,100,.2);color:#888}
.tracker-wrap{margin-bottom:4px;padding:6px;background:linear-gradient(135deg,rgba(199,125,255,.08),rgba(168,85,247,.05));border-radius:10px;border:1px solid rgba(199,125,255,.15)}
.tracker-title{font-size:10px;color:#c77dff;font-weight:bold;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.tracker-title .t-icon{font-size:14px}
.tracker-stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.t-stat{flex:1;min-width:45%;background:rgba(0,0,0,.2);padding:4px 6px;border-radius:6px}
.t-stat-l{font-size:8px;color:#555}
.t-stat-v{font-size:11px;font-weight:bold;color:#fff}
.t-conf{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-top:3px}
.t-conf-fill{height:100%;background:linear-gradient(90deg,#5dade2,#c77dff);transition:width .3s}
.tracker-actions{display:flex;gap:3px;margin-top:4px}
.t-btn{flex:1;padding:4px 6px;border:none;border-radius:4px;font-size:9px;font-weight:bold;cursor:pointer;background:rgba(255,255,255,.04);color:#555;transition:all .08s}
.t-btn:active{transform:scale(.95)}
.t-btn.on{background:rgba(199,125,255,.2);color:#c77dff}
.t-btn.rst{background:rgba(255,71,87,.1);color:#ff4757}
.scene-wrap{margin-bottom:4px}
.scene-tabs{display:flex;gap:2px;margin-bottom:3px}
.s-tab{flex:1;padding:8px 0;border:none;border-radius:6px;font-size:11px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.04);color:#444;transition:all .1s}
.s-tab.on{color:#fff}
.s-tab.pre.on{background:linear-gradient(135deg,#1a4d2e,#0d2818);color:#2ed573}
.s-tab.post.on{background:linear-gradient(135deg,#4d2600,#2d1800);color:#ffa502}
.scene-btns{display:flex;gap:3px;flex-wrap:wrap}
.big-btn{flex:1;min-width:48%;padding:12px 8px;border:none;border-radius:10px;font-size:13px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.04);color:#555;transition:all .08s;text-align:center}
.big-btn:active{transform:scale(.95)}
.big-btn.on{color:#fff;box-shadow:0 0 15px rgba(255,255,255,.1)}
.big-btn.open.on{background:linear-gradient(135deg,#1a5c30,#0d3d1f);color:#2ed573}
.big-btn.raise.on{background:linear-gradient(135deg,#8b1a1a,#5c1010);color:#ff6b6b}
.big-btn.call.on{background:linear-gradient(135deg,#8b5a00,#5c3a00);color:#ffa502}
.big-btn.reraise.on{background:linear-gradient(135deg,#5c1a8b,#3d105c);color:#c77dff}
.big-btn.check.on{background:linear-gradient(135deg,#3d3d3d,#2a2a2a);color:#aaa}
.big-btn.bet.on{background:linear-gradient(135deg,#8b1a1a,#5c1010);color:#ff6b6b}
.big-btn.allin.on{background:linear-gradient(135deg,#5c1a8b,#3d105c);color:#c77dff}
.big-btn .b-emoji{font-size:18px;display:block;margin-bottom:2px}
.cards-row{display:flex;gap:3px;margin-bottom:4px;justify-content:center;align-items:flex-end}
.card-slot{width:38px;height:52px;border:1.5px dashed rgba(255,255,255,.1);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:7px;color:#333;background:rgba(0,0,0,.12);transition:all .08s}
.card-slot:active{transform:scale(.9)}
.card-slot.f{border:none;background:#f5f5f0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card-slot .cr{font-size:16px;font-weight:900;line-height:1}
.card-slot .cs{font-size:11px;line-height:1}
.card-slot.red{color:#c41e3a}.card-slot.blk{color:#1a1a1a}
.card-label{font-size:7px;color:#444;text-align:center;margin-top:1px}
.card-group{display:flex;flex-direction:column;align-items:center}
.card-sep{width:1px;height:36px;background:rgba(255,255,255,.05);margin:0 2px}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:4px}
.mx-wrap.collapsed{display:none}
.mx{border-collapse:collapse;margin:0 auto}
.mx th,.mx td{width:24px;height:24px;text-align:center;font-size:8px;font-weight:700;border:1px solid rgba(255,255,255,.03)}
.mx th{color:#444;font-size:7px;background:rgba(0,0,0,.15)}
.mx td{cursor:pointer;transition:all .06s;border-radius:2px}
.mx td:active{transform:scale(.85)}
.mx td.sel{outline:2px solid #ffd700;outline-offset:-1px}
.c-r{background:rgba(46,213,115,.45);color:#fff}.c-c{background:rgba(255,165,2,.35);color:#fff}
.c-b{background:rgba(93,173,226,.35);color:#fff}.c-f{background:rgba(255,255,255,.02);color:#333}
.c-p{font-weight:900}
.mx-legend{display:flex;gap:5px;justify-content:center;font-size:8px;color:#444;margin:1px 0 3px}
.ml{width:6px;height:6px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:1px}
.hint{font-size:9px;color:#555;text-align:center;padding:3px;background:rgba(255,255,255,.02);border-radius:4px;margin-bottom:3px}
.cam-mini{position:fixed;bottom:8px;right:8px;z-index:50}
.cam-mini-btn{width:36px;height:36px;border:none;border-radius:50%;font-size:16px;cursor:pointer;background:rgba(0,0,0,.7);color:#888;transition:all .1s;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cam-mini-btn.on{background:rgba(46,213,115,.8);color:#fff}
.cam-mini-btn:active{transform:scale(.9)}
.adv-t{font-size:10px;color:#555;text-align:center;padding:6px;cursor:pointer;border-top:1px solid rgba(255,255,255,.03);background:rgba(0,0,0,.15);border-radius:6px}
.adv{display:none;padding:6px;background:rgba(0,0,0,.25);border-radius:6px;margin-bottom:4px}
.adv.show{display:block}
.adv-row{display:flex;gap:3px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.adv-l{font-size:9px;color:#555;min-width:40px}
.adv-btn{padding:5px 8px;border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.04);color:#555;transition:all .06s}
.adv-btn.on{background:rgba(168,85,247,.12);color:#a855f7}
.adv-inp{width:50px;padding:4px 6px;border:1px solid rgba(255,255,255,.08);border-radius:4px;background:rgba(0,0,0,.2);color:#fff;font-size:11px;font-weight:bold;text-align:center}
.adv-sub{font-size:9px;color:#666;margin-bottom:4px}
.exploit-row{display:flex;gap:3px;margin-bottom:4px}
.ex-btn{flex:1;padding:8px 0;border:none;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.04);color:#555;transition:all .08s;text-align:center}
.ex-btn:active{transform:scale(.95)}
.ex-btn.on{color:#fff}
.ex-btn.fish.on{background:linear-gradient(135deg,#1a5c30,#0d3d1f)}
.ex-btn.maniac.on{background:linear-gradient(135deg,#5c1a4a,#3d0d30)}
.ex-btn.cs.on{background:linear-gradient(135deg,#1a3d5c,#0d2d3d)}
.ex-btn.nit.on{background:linear-gradient(135deg,#3d3d1a,#2d2d0d)}
.ex-btn.tp.on{background:linear-gradient(135deg,#1a3d5c,#0d2840)}
.ex-btn.lag.on{background:linear-gradient(135deg,#5c1a1a,#3d0d0d)}
.ex-btn.unknown.on{background:linear-gradient(135deg,#333,#222);color:#888}
.ex-btn .e-emoji{font-size:16px;display:block;margin-bottom:1px}
.clr{display:block;width:100%;padding:8px;border:1px solid rgba(255,71,87,.15);border-radius:8px;background:transparent;color:#ff4757;font-size:11px;font-weight:bold;cursor:pointer;margin-top:4px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:100;padding:8px;overflow-y:auto}
.modal.on{display:block}
.mt{text-align:center;font-size:14px;color:#ffd700;margin-bottom:6px;font-weight:bold}
.ms-row{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.ms-btn{padding:6px 14px;border:none;border-radius:12px;font-size:16px;cursor:pointer;background:rgba(255,255,255,.06);transition:all .06s}
.ms-btn.on{background:#ffd700}
.m-grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;max-width:460px;margin:0 auto}
.m-c{aspect-ratio:.75;border:none;border-radius:2px;font-size:10px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f5f0;transition:all .05s;padding:1px 0}
.m-c:active{transform:scale(.85)}
.m-c.red{color:#c41e3a}.m-c.blk{color:#1a1a1a}
.m-c.dis{opacity:.12;pointer-events:none}
.m-c .mr{font-size:11px;line-height:1}.m-c .ms{font-size:8px;line-height:1}
.m-cl{display:block;margin:8px auto;padding:6px 20px;border:none;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:11px;cursor:pointer}
.cam-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:200;padding:8px}
.cam-modal.on{display:block}
.cam-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cam-title{font-size:14px;color:#ffd700;font-weight:bold}
.cam-close{padding:6px 14px;border:none;border-radius:6px;background:rgba(255,71,87,.2);color:#ff4757;font-size:11px;cursor:pointer}
.cam-wrap{position:relative;border-radius:10px;overflow:hidden;background:#000}
.cam-wrap video{width:100%;display:block;border-radius:10px}
.cam-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.cam-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.6);padding:4px;border-radius:0 0 10px 10px}
.cam-result{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.cam-card{padding:5px 10px;border-radius:5px;font-size:13px;font-weight:bold;cursor:pointer}
.cam-card.hi{background:rgba(46,213,115,.2);color:#2ed573;border:1px solid rgba(46,213,115,.3)}
.cam-card.ok{background:rgba(255,215,0,.2);color:#ffd700;border:1px solid rgba(255,215,0,.4)}
.cam-card.add{background:rgba(255,255,255,.05);color:#888;border:1px dashed rgba(255,255,255,.1)}
.cam-card .cf{font-size:9px;color:#888;margin-left:2px}
.set-panel{margin-top:6px;padding:6px;background:rgba(0,0,0,.3);border-radius:6px}
.set-row{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.set-lbl{color:#666;font-size:10px;min-width:50px}
.set-inp{flex:1;padding:5px 8px;border:1px solid rgba(255,255,255,.1);border-radius:5px;background:rgba(0,0,0,.3);color:#fff;font-size:11px}
.set-btn{padding:5px 10px;border:none;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer}
.set-btn.save{background:#2ed573;color:#000}
.set-btn.test{background:rgba(93,173,226,.2);color:#5dade2}
.set-info{font-size:9px;color:#555;margin-top:3px}
.yolo-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:900}
.yolo-badge.on{background:rgba(46,213,115,.15);color:#2ed573}
.yolo-badge.off{background:rgba(255,255,255,.05);color:#444}
/* === V1.5 极速模式 === */
body.speed-mode .tracker-wrap,
body.speed-mode .scene-wrap,
body.speed-mode .cards-row,
body.speed-mode .hint,
body.speed-mode .mx-wrap,
body.speed-mode .adv-t,
body.speed-mode .adv,
body.speed-mode .cam-mini{display:none!important}
body.speed-mode .res{position:fixed;top:0;left:0;right:0;z-index:999;min-height:auto;border-radius:8px;padding:4px 8px;background:rgba(10,20,40,.92);border:1px solid rgba(46,213,115,.3);justify-content:flex-start}
body.speed-mode .r-a{font-size:22px;letter-spacing:2px;padding:2px 6px;border-radius:6px;display:inline-block;margin-bottom:2px}
body.speed-mode .r-v{font-size:14px;margin-top:1px}
body.speed-mode .r-d{font-size:11px;margin-top:1px}
body.speed-mode .r-tip{font-size:20px;padding:4px 10px;margin-top:4px;font-weight:900;border-radius:8px;display:inline-block;text-shadow:0 1px 4px rgba(0,0,0,.5)}
body.speed-mode .r-class{font-size:9px;margin-top:2px}
body.speed-mode .r-drta,
body.speed-mode .r-spr,
body.speed-mode .r-ev-sm,
body.speed-mode .r-plan,
body.speed-mode .r-exploit{display:none!important}
body.speed-mode .speed-exit{display:inline-block!important}
.speed-exit{display:none!important;font-size:10px;color:#555;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer;margin-top:6px}
.speed-exit:active{background:rgba(255,255,255,.15)}
@keyframes resultPulse{0%{transform:scale(1)}25%{transform:scale(1.06)}50%{transform:scale(1)}75%{transform:scale(1.03)}100%{transform:scale(1)}}
.result-pulse{animation:resultPulse .4s ease-out}
@keyframes borderFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 20px 4px rgba(255,255,255,.3)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.border-flash{animation:borderFlash .5s ease-out}
/* API处理中状态 */
.api-processing .res{opacity:.6}
.api-processing .res::after{content:'⏳ 识别中...';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#ffd700;font-weight:900}
.api-processing .res{position:relative}
/* === V2.0 识别结果展示 === */
.rec-banner{display:none;background:linear-gradient(135deg,#1a237e,#0d47a1);border-radius:10px;padding:8px;margin-bottom:4px;text-align:center;border:1px solid rgba(144,202,249,.3)}
.rec-banner.on{display:block}
.rec-label{font-size:9px;color:#90caf9;margin-bottom:3px;font-weight:bold}
.rec-cards{display:flex;justify-content:center;gap:2px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.rec-card{display:inline-flex;flex-direction:column;align-items:center;padding:2px 5px;background:rgba(255,255,255,.12);border-radius:4px;min-width:28px}
.rec-card .rc-r{font-size:16px;font-weight:900;line-height:1}
.rec-card .rc-s{font-size:12px;line-height:1}
.rec-card.red{color:#ff6b6b}.rec-card.blk{color:#e0e0e0}
.rec-sep{width:1px;height:24px;background:rgba(255,255,255,.2);margin:0 3px}
.rec-info{font-size:10px;color:#90caf9;margin-top:2px}
body.speed-mode .rec-banner{padding:10px;border-radius:14px;border-width:2px}
body.speed-mode .rec-card .rc-r{font-size:20px}
body.speed-mode .rec-card .rc-s{font-size:14px}
body.speed-mode .rec-info{font-size:12px;font-weight:bold}
body.speed-mode .rec-label{font-size:10px}
</style>
</head>
<body class="speed-mode">
<div class="rec-banner" id="recBanner">
  <div class="rec-label">🔍 识别结果</div>
  <div class="rec-cards" id="recCards"></div>
  <div class="rec-info" id="recInfo"></div>
</div>
<div class="res" id="res"><div style="color:#555;font-size:14px">📷 截图即可开始分析</div></div>
<div class="tracker-wrap" id="trackerWrap">
  <div class="tracker-title"><span class="t-icon">🎯</span>对手追踪 <span id="oppTypeTag" style="font-size:9px;padding:1px 5px;background:rgba(199,125,255,.2);border-radius:3px;color:#c77dff">unknown</span></div>
  <div class="tracker-stats" id="trackerStats">
    <div class="t-stat"><div class="t-stat-l">手数</div><div class="t-stat-v" id="tHands">0</div></div>
    <div class="t-stat"><div class="t-stat-l">VPIP</div><div class="t-stat-v" id="tVpip">--</div></div>
    <div class="t-stat"><div class="t-stat-l">PFR</div><div class="t-stat-v" id="tPfr">--</div></div>
    <div class="t-stat"><div class="t-stat-l">AF</div><div class="t-stat-v" id="tAf">--</div></div>
    <div class="t-stat"><div class="t-stat-l">弃牌率</div><div class="t-stat-v" id="tFtB">--</div></div>
    <div class="t-stat"><div class="t-stat-l">近侵</div><div class="t-stat-v" id="tRagg">--</div></div>
  </div>
  <div class="t-conf"><div class="t-conf-fill" id="tConfFill" style="width:0%"></div></div>
  <div class="tracker-actions">
    <button class="t-btn" id="tBtnUnknown" onclick="setTrackerType('unknown')">❓未知</button>
    <button class="t-btn" id="tBtnFish" onclick="setTrackerType('fish')">🐟鱼</button>
    <button class="t-btn" id="tBtnTP" onclick="setTrackerType('tight')">🎯紧被动</button>
    <button class="t-btn" id="tBtnLAG" onclick="setTrackerType('lag')">🔥松凶</button>
    <button class="t-btn rst" onclick="resetTracker()">🔄重置</button>
  </div>
</div>
<div class="scene-wrap" id="sceneWrap">
  <div class="scene-tabs">

<script>
// ===== v14 GTO+DRTA融合引擎 =====

// 全局常量
var R=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
var RV={A:12,K:11,Q:10,J:9,T:8,'9':7,'8':6,'7':5,'6':4,'5':3,'4':2,'3':1,'2':0};
var SU=['h','d','s','c'];

// 全局状态
var G={phase:'pre',scene:'open',tt:6,pos:'btn',act:6,opp:'unknown',stk:100,pot:10,bet:0,hole:[null,null],comm:[null,null,null,null,null],buttons:[]};
var _pi=null,_ms='h';
var _decisionCache={};var _cacheMax=200;
function cacheKey(){return G.phase+'_'+G.scene+'_'+G.pos+'_'+G.act+'_'+G.opp+'_'+G.stk+'_'+G.pot+'_'+G.bet+'_'+(G.hole[0]?G.hole[0].rank+G.hole[0].suit:'')+(G.hole[1]?G.hole[1].rank+G.hole[1].suit:'')+G.comm.filter(function(c){return c;}).map(function(c){return c.rank+c.suit;}).join('');}
var camStream=null,scanTimer=null,scanning=false;
var mxVisible=true;

// ===== P0: DRTA OpponentTracker =====
var DRTA={
  tracker:null,
  bluffAttempts:0,
  bluffCalled:0,
  lastHands:0,
  STORAGE_KEY:'poker_v14_tracker',
  BLUFF_FREQ:{nit:0.45,tight:0.35,tag:0.20,lag:0.10,fish:0.05,calling_station:0.02,maniac:0.15,unknown:0.10},
  TYPE_INIT:{fish:{vpip:60,pfr:15,af:0.6},nit:{vpip:12,pfr:10,af:0.5},tight:{vpip:18,pfr:15,af:0.8},tag:{vpip:22,pfr:18,af:1.8},lag:{vpip:50,pfr:35,af:2.5},calling_station:{vpip:55,pfr:10,af:0.3},maniac:{vpip:70,pfr:45,af:3.5},unknown:{vpip:30,pfr:20,af:1.0}},
  
  init:function(){
    this.tracker={
      hands:0,vpip:0,pfr:0,bet_count:0,call_count:0,fold_count:0,check_count:0,
      _bet_faced:0,_fold_to_bet:0,recent_agg:[],bluff_attempts:0,bluff_called:0,lastActionTime:0
    };
    this.load();
    this.updateUI();
  },
  
  record:function(action,street,isFacingBet){
    var t=this.tracker;
    t.hands++;
    t.lastActionTime=Date.now();
    var agg=0;
    if(action==='bet'||action==='raise'||action==='reraise'){
      agg=2;t.bet_count++;
      if(street==='preflop'&&(action==='raise'||action==='reraise'))t.pfr++;
    }else if(action==='call'){agg=0.5;t.call_count++;}
    else if(action==='fold'){t.fold_count++;if(isFacingBet)t._fold_to_bet++;}
    else if(action==='check'){agg=-0.5;t.check_count++;}
    t.recent_agg.push(agg);
    if(t.recent_agg.length>5)t.recent_agg.shift();
    if(street==='preflop'&&(action==='call'||action==='bet'||action==='raise'||action==='reraise'))t.vpip++;
    if(isFacingBet)t._bet_faced++;
    if(t.hands%5===0)this.save();
    this.updateUI();
  },
  
  getProfile:function(){
    var t=this.tracker;
    var p={type:'unknown',confidence:0,vpip:0,pfr:0,af:0,fold_to_bet:50,recent_agg:0,bluff_success_rate:0.5,bluff_attempts:t.bluff_attempts};
    if(t.hands<3)return p;
    p.vpip=Math.round(t.vpip/t.hands*100);
    p.pfr=Math.round(t.pfr/t.hands*100);
    p.af=parseFloat((t.bet_count/Math.max(t.call_count,1)).toFixed(2));
    p.fold_to_bet=t._bet_faced>0?Math.round(t._fold_to_bet/t._bet_faced*100):50;
    p.recent_agg=parseFloat((t.recent_agg.reduce(function(a,b){return a+b;},0)/Math.max(t.recent_agg.length,1)).toFixed(2));
    p.bluff_attempts=t.bluff_attempts;
    p.bluff_success_rate=t.bluff_attempts>0?(1-t.bluff_called/t.bluff_attempts):0.5;
    p.confidence=Math.min(t.hands/15,1);
    p.type=this.classify(p);
    return p;
  },
  
  classify:function(p){
    var vpip=p.vpip,af=p.af,ftb=p.fold_to_bet;
    if(vpip>=65&&af>=3.0)return'maniac';
    if(vpip>=50&&af<0.5)return'calling_station';
    if(vpip>=40&&af<1.0)return'fish';
    if(vpip<15&&ftb>=60)return'nit';
    if(vpip<=25&&ftb>=55)return'tight';
    if(vpip<=25&&af>=1.5)return'tag';
    if(vpip>=35&&af>=2.0)return'lag';
    if(vpip>=30&&ftb>=50)return'tight';
    if(vpip>=30&&af>=1.5)return'tag';
    return'unknown';
  },
  
  getDRTAWeight:function(profile){
    var type=profile.type,conf=profile.confidence;
    var base={
      maniac:{gto:0.25,drta:0.75},
      calling_station:{gto:0.25,drta:0.75},
      fish:{gto:0.30,drta:0.70},
      nit:{gto:0.35,drta:0.65},
      tight:{gto:0.40,drta:0.60},
      lag:{gto:0.55,drta:0.45},
      tag:{gto:0.75,drta:0.25},
      unknown:{gto:0.85,drta:0.15}
    };
    var b=base[type]||base.unknown;
    // 动态权重: 样本不足时回归GTO
    // <5手→GTO 95%, <15手→线性过渡, >=30手→完全使用base权重
    var minHands=5,midHands=15,fullHands=30;
    if(conf<0.33){
      return{gto:0.95,drta:0.05};
    }
    if(conf<1.0){
      var t=(conf-0.33)/0.67;
      var safeGto=0.90,safeDrta=0.10;
      return{
        gto:b.gto*t+safeGto*(1-t),
        drta:b.drta*t+safeDrta*(1-t)
      };
    }
    return b;
  },
  
  recordBluff:function(success){
    var t=this.tracker;
    t.bluff_attempts++;
    if(!success)t.bluff_called++;
    this.bluffAttempts=t.bluff_attempts;
    this.bluffCalled=t.bluff_called;
  },
  
  save:function(){
    try{
      localStorage.setItem(this.STORAGE_KEY,JSON.stringify(this.tracker));
    }catch(e){}
  },
  
  load:function(){
    try{
      var d=localStorage.getItem(this.STORAGE_KEY);
      if(d){
        var loaded=JSON.parse(d);
        for(var k in loaded)this.tracker[k]=loaded[k];
      }
    }catch(e){}
  },
  
  reset:function(){
    this.tracker={hands:0,vpip:0,pfr:0,bet_count:0,call_count:0,fold_count:0,check_count:0,_bet_faced:0,_fold_to_bet:0,recent_agg:[],bluff_attempts:0,bluff_called:0,lastActionTime:0};
    this.bluffAttempts=0;this.bluffCalled=0;
    try{localStorage.removeItem(this.STORAGE_KEY);}catch(e){}
    this.updateUI();
  },
  
  updateUI:function(){
    var p=this.getProfile();
    document.getElementById('tHands').textContent=p.hands;
    document.getElementById('tVpip').textContent=p.hands>=3?p.vpip+'%':'--';
    document.getElementById('tPfr').textContent=p.hands>=3?p.pfr+'%':'--';
    document.getElementById('tAf').textContent=p.hands>=3?p.af:'--';
    document.getElementById('tFtB').textContent=p.hands>=3?p.fold_to_bet+'%':'--';
    document.getElementById('tRagg').textContent=p.hands>=3?p.recent_agg.toFixed(1):'--';
    document.getElementById('tConfFill').style.width=(p.confidence*100)+'%';
    var tagMap={maniac:'😈疯子',calling_station:'📞跟注站',fish:'🐟鱼',nit:'🔒超紧',tight:'🎯紧被动',lag:'🔥松凶',tag:'🏆紧凶',unknown:'❓未知'};
    document.getElementById('oppTypeTag').textContent=tagMap[p.type]||'❓未知';
    ['Unknown','Maniac','CS','Fish','NIT','TP','LAG'].forEach(function(t){
      document.getElementById('tBtn'+t).classList.remove('on');
    });
    var btnMap={unknown:'Unknown',maniac:'Maniac',calling_station:'CS',fish:'Fish',nit:'NIT',tight:'TP',lag:'LAG'};
    var btnId='tBtn'+btnMap[p.type];
    if(document.getElementById(btnId))document.getElementById(btnId).classList.add('on');
  },
  
  setType:function(type){
    var init=this.TYPE_INIT[type]||this.TYPE_INIT.unknown;
    var t=this.tracker;
    t.vpip=init.vpip;t.pfr=init.pfr;
    t.af=init.af;t.bet_count=Math.round(init.vpip*0.3);t.call_count=Math.round(init.vpip*0.5);
    this.updateUI();
  }
};

// ===== P1: StrategicBluff - 战略性诈唬 =====
var StrategicBluff={
  check:function(eq,hClass,street,scene,profile,bTexture,opponents,pot,bet,sizing){
    var type=profile.type,conf=profile.confidence,ftb=profile.fold_to_bet||50,bsr=profile.bluff_success_rate||0.5;
    var blu={action:null,strategy:null,sizing:null};
    var isDryBoard=!bTexture||!bTexture.wetness||bTexture.wetness<2;
    // 河牌bluff条件: 干燥面+1-2人+弃牌率>50%+AIR/WEAK+置信>=0.3
    if(street==='river'&&hClass.name==='AIR'&&(scene==='check'||scene==='opponent_check')){
      if(ftb>=50&&opponents<=2&&isDryBoard&&conf>=0.3){
        var bf=DRTA.BLUFF_FREQ[type]||0.10;
        // vs nit/tight: 更高诈唬频率
        if(type==='nit')bf=Math.min(0.6,bf*1.3);
        if(type==='tight')bf=Math.min(0.5,bf*1.2);
        // 被剥削检测: bluff成功率<30%且>=3次尝试→降频70%
        if(bsr<0.3&&profile.bluff_attempts>=3)bf*=0.3;
        if(Math.random()<bf){
          blu.action='raise';blu.strategy='河牌bluff(f='+(bf*100).toFixed(0)+'%)';
          blu.sizing=Math.round(pot*0.6);
        }
      }
    }
    // 半诈唬: 8+outs+对手可逼退
    if((street==='flop'||street==='turn')&&hClass.name==='DRAW'&&hClass.outs>=8){
      if(conf>=0.2&&opponents<=2){
        var bf2=DRTA.BLUFF_FREQ[type]||0.10;
        if(Math.random()<bf2){
          blu.action='raise';blu.strategy='半诈唬('+hClass.outs+'outs)';
          blu.sizing=Math.round(pot*0.6);
        }
      }
    }
    return blu;
  },
  
  thinValue:function(eq,hClass,street,scene,profile,opponents){
    // 薄价值下注: 鱼玩家+50%+equity
    if((profile.type==='fish'||profile.type==='calling_station')&&eq>=45&&opponents<=2&&(scene==='check'||scene==='opponent_check')){
      var thinSz=profile.type==='calling_station'?Math.round(G.pot*0.4):Math.round(G.pot*0.5);
      return{action:'raise',strategy:'薄价值下注('+profile.type+')',sizing:thinSz};
    }
    return{action:null};
  }
};

// ===== P1: StrategicRetreat - 战略撤退 =====
var StrategicRetreat={
  check:function(eq,hClass,street,scene,profile,bTexture,spr,opponents,pot,bet){
    var type=profile.type,conf=profile.confidence,af=profile.af||1,ra=profile.recent_agg||0;
    var ret={action:null,strategy:null};
    // set/trap识别: 紧凶/紧被动在湿面raise→弃STRONG/MEDIUM
    if((type==='tag'||type==='tight'||type==='nit')&&conf>=0.4){
      if(bTexture&&bTexture.wetness>=2&&(scene==='bet'||scene==='raise'||scene==='allin')){
        if(hClass.name==='STRONG'||hClass.name==='MEDIUM'){
          ret.action='fold';ret.strategy='陷阱弃牌(set/trap识别)';
          return ret;
        }
      }
    }
    // SPR撤退: SPR<3+全下+中等牌→弃牌
    if(spr<3&&(scene==='allin'||scene==='raise')){
      if(hClass.name==='MEDIUM'&&eq<50){
        ret.action='fold';ret.strategy='SPR<'+spr.toFixed(1)+'战略弃牌';
        return ret;
      }
    }
    // 鱼突变检测: 近期侵略指数飙升→弃牌
    if((type==='fish'||type==='maniac')&&ra>=1.5){
      if(hClass.name==='MEDIUM'||hClass.name==='WEAK'||hClass.name==='DRAW'){
        ret.action='fold';ret.strategy='鱼突变警戒(RAgg='+ra.toFixed(1)+')';
        return ret;
      }
    }
    // 大raise撤退: MEDIUM面对>60%底池
    if(hClass.name==='MEDIUM'&&bet>0){
      var betPotRatio=bet/pot;
      if(betPotRatio>0.6&&(scene==='raise'||scene==='allin')){
        ret.action='fold';ret.strategy='大raise撤退(>'+(betPotRatio*100).toFixed(0)+'%底池)';
        return ret;
      }
    }
    return ret;
  }
};

var LagTrap={

    if((profile.type==='lag'||profile.type==='maniac')&&(hClass.name==='STRONG'||hClass.name==='NUTS')&&eq>=60){
      if(scene==='check'&&(street==='flop'||street==='turn')){
        return{action:'check',strategy:'LAG慢打(trap)'};

    }
    return{action:null};
  }
};

function getCurrentStreet(){
  var cc=G.comm.filter(function(c){return c;}).length;
  if(cc===0)return'preflop';
  if(cc<=3)return'flop';
  if(cc===4)return'turn';
  return'river';

  var am={raise:'加注',call:'跟注',fold:'弃牌',check:'过牌',allin:'全下'};

  var btnText='';
  if(G.buttons && G.buttons.length>0){
    if(r.a==='fold') btnText=G.buttons.find(function(b){return b.indexOf('弃牌')>=0;})||'';

    else if(r.a==='allin') btnText=G.buttons.find(function(b){return b.indexOf('全下')>=0;})||'';
  }
  var displayAction=btnText||cn;
  // V2.9.1: 极速模式建议做大、动作缩成小标签
  var tip='';
  if(r.a==='raise'||r.a==='allin')tip='位好可加注';
  else if(r.a==='call')tip='赔率够可跟';
  else if(r.a==='fold')tip='牌力不够弃牌';
  else if(r.a==='check')tip='牌力中等过牌';
  if(G.stk<=30)tip='短码→'+cn;
  var h='<div class="r-a '+r.a+'">💡按【'+displayAction+'】</div>';

  }

  if(r.drta){
    var drta=r.drta;
    var typeNames={fish:'🐟鱼',tight:'🎯紧被动',lag:'🔥松凶',tag:'🏆紧凶',unknown:'❓未知'};
    var typeName=typeNames[drta.type]||drta.type;
    var confPct=Math.round((drta.conf||0)*100);
    var strategy=drta.strategy?' | '+drta.strategy:'';
    h+='<div class="r-drta">DRTA: '+typeName+' | 置信'+confPct+'%'+strategy+'</div>';
  }

function mcVsRange(hole,comm,oppRange,iterations){if(iterations===undefined)iterations=2000;var known=[].concat(hole,comm.filter(function(c){return c;}));var deck=[];for(var ri=0;ri<R.length;ri++){for(var si=0;si<SU.length;si++){var rank=R[ri];var suit=SU[si];if(!known.some(function(c){return c.rank===rank&&c.suit===suit;})){deck.push({rank:rank,suit:suit});}}}var cn=comm.filter(function(c){return c;}).length;var nd=5-cn;var oppHands=[];for(var ki=0;ki<oppRange.length;ki++){var key=oppRange[ki];var hands=handKeyToCards(key);for(var hi=0;hi<hands.length;hi++){var h=hands[hi];if(!known.some(function(c){return c.rank===h[0].rank&&c.suit===h[0].suit;})&&!known.some(function(c){return c.rank===h[1].rank&&c.suit===h[1].suit;})){oppHands.push(h);}}}var w=0,t=0;var hv=eH([].concat(hole,comm.filter(function(c){return c;})));for(var i=0;i<iterations;i++){var sh=[].concat(deck);for(var j=sh.length-1;j>sh.length-1-nd&&j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=sh[j];sh[j]=sh[k];sh[k]=tmp;}var board=[].concat(comm.filter(function(c){return c;}),sh.slice(-nd));var myBest=eH([].concat(hole,board));var oppBest=0;if(oppHands.length>0){var oppIdx=Math.floor(Math.random()*oppHands.length);var oppHole=oppHands[oppIdx];if(oppHole)oppBest=eH([].concat(oppHole,board));}else{var oppSh=[].concat(deck.slice(0,-nd));for(var jj=oppSh.length-1;jj>oppSh.length-3&&jj>0;jj--){var kk=Math.floor(Math.random()*(jj+1));var tmp2=oppSh[jj];oppSh[jj]=oppSh[kk];oppSh[kk]=tmp2;}oppBest=eH([oppSh[0],oppSh[1]].concat(board));}if(myBest>oppBest)w++;else if(myBest===oppBest)t++;}return{eq:(w+t*0.5)/iterations*100,win:w/iterations*100,tie:t/iterations*100};}
function handKeyToCards(key){var results=[];var r1=key[0],r2=key[1];var isSuited=key.indexOf('s')!==-1;var isPaired=r1===r2;if(isPaired){for(var s1i=0;s1i<SU.length;s1i++){for(var s2i=0;s2i<SU.length;s2i++){if(SU[s1i]!==SU[s2i])results.push([{rank:r1,suit:SU[s1i]},{rank:r2,suit:SU[s2i]}]);}}}else if(isSuited){for(var si=0;si<SU.length;si++){results.push([{rank:r1,suit:SU[si]},{rank:r2,suit:SU[si]}]);}}else{for(var s1j=0;s1j<SU.length;s1j++){for(var s2j=0;s2j<SU.length;s2j++){if(SU[s1j]!==SU[s2j])results.push([{rank:r1,suit:SU[s1j]},{rank:r2,suit:SU[s2j]}]);}}}return results;}

function simpleDetect(canvas){
  var ctx=canvas.getContext('2d');
  var w=canvas.width,h=canvas.height;
  var grid=5;var cellW=w/grid,cH=h/grid;
  var results=[];
  for(var gy=0;gy<grid;gy++){
    for(var gx=0;gx<grid;gx++){
      var x=gx*cellW,y=gy*cH;
      var d=ctx.getImageData(x,y,cellW,cH).data;
      var r=0,g=0,b=0,count=0;
      for(var i=0;i<d.length;i+=40){r+=d[i];g+=d[i+1];b+=d[i+2];count++;}
      r/=count;g/=count;b/=count;
      if(g>Math.max(r,b)*1.2)results.push({x:gx,y:gy,type:'spade',conf:g/255});
      else if(r>Math.max(g,b)*1.1&&r>150)results.push({x:gx,y:gy,type:'heart',conf:r/255});
      else if(b>Math.max(r,g)*1.1&&b>100)results.push({x:gx,y:gy,type:'club',conf:b/255});
      else if(r>150&&b<80)results.push({x:gx,y:gy,type:'diamond',conf:r/255});
    }
  }
  if(results.length>0){
    results.sort(function(a,b){return b.conf-a.conf;});
    var top=results.slice(0,4);
    document.getElementById('camHint').textContent='检测到 '+top.length+' 张牌';
    renderCards(top);
  }
}

// V2.9.12: 从按钮文字自动推导场景（替代手动选择）
function detectSceneFromButtons(buttons, street, activePlayers) {
  if (!buttons || buttons.length === 0) {
    return street === 'preflop' ? 'open' : 'check';
  }
  var hasAllin = buttons.some(function(b){return b.indexOf('全下')>=0;});
  if (hasAllin) return 'allin';
  var hasReraise = buttons.some(function(b){return b.indexOf('再加注')>=0;});
  if (hasReraise) return 'reraise';
  var hasCall = buttons.some(function(b){return b.indexOf('跟注')>=0;});
  var hasCheck = buttons.some(function(b){return b.indexOf('过牌')>=0;});
  var hasRaise = buttons.some(function(b){return b.indexOf('加注')>=0;});
  var hasBet = buttons.some(function(b){return b.indexOf('下注')>=0;});
  if (hasCall && street === 'preflop') {
    return (activePlayers > 2) ? 'call' : 'raise';
  }
  if (hasCall && street !== 'preflop') return 'bet';
  if (hasCheck && hasRaise) return 'check';
  if (hasCheck) return 'check';
  if (hasRaise && !hasCall && !hasCheck) return 'open';
  if (hasBet && !hasCall && !hasCheck) return street === 'preflop' ? 'open' : 'bet';
  if (hasBet && hasCheck) return 'check';
  return street === 'preflop' ? 'open' : 'check';
}

// V1.3: API视觉识别结果回调 - 自动填入牌面+策略分析
function onVisionResult(data){
  if(!data) return;
  
  // V2.9: 先重置所有牌面，防止残留上一局数据
  G.hole=[null,null];G.comm=[null,null,null,null,null];
  
  // 1. 自动填入手牌
  if(data.hole_cards && data.hole_cards.length>=2){
    G.hole=[];
    for(var i=0;i<data.hole_cards.length && i<2;i++){
      var c=data.hole_cards[i];
      if(c.rank && c.suit){
        G.hole.push({rank:c.rank,suit:c.suit});
      }
    }
  }
  
  // 2. 自动填入公共牌
  if(data.community_cards){
    G.comm=[];
    for(var i=0;i<data.community_cards.length && i<5;i++){
      var c=data.community_cards[i];
      if(c.rank && c.suit){
        G.comm.push({rank:c.rank,suit:c.suit});
      } else {
        G.comm.push(null);
      }
    }
    while(G.comm.length<5) G.comm.push(null);
  }
  
  // 3. V2.9.12: 从按钮文字自动推导场景（不调setScene，避免覆盖pot/bet和重复go）
  if(data.street){
    var street=(data.street||'').toLowerCase();
    var activeP=parseInt(data.active_players)||2;
    if(street==='preflop'||street==='pre'){
      G.phase='pre';
    } else {
      G.phase='post';
    }
    var detectedScene=detectSceneFromButtons(data.buttons||[],street,activeP);
    G.scene=detectedScene;
  }
  
  // 4. 自动设定桌型和位置
  // V2.9.15: active_players必须用API返回值，不能用total_players覆盖
  if(data.total_players){
    G.tt=parseInt(data.total_players)||6;
  }
  if(data.active_players){
    G.act=parseInt(data.active_players)||G.tt;
  } else if(data.total_players){
    G.act=G.tt; // 兼容：旧版API无active_players时降级
  }
  // V2.9.16: JS端二次校验——防止矛盾数据进策略引擎
  (function validateAndCorrect(){
    var corrections=[];
    // 规则1: active不能超过total
    if(G.act>G.tt){corrections.push('act('+G.act+')>tt('+G.tt+')→act=tt');G.act=G.tt;}
    // 规则2: active至少2人
    if(G.act<2){corrections.push('act('+G.act+')<2→act=tt('+G.tt+')');G.act=G.tt;}
    // 规则3: preflop阶段active应等于total（没人弃牌）
    if(G.phase==='pre'&&G.act<G.tt){corrections.push('preflop act('+G.act+')<tt('+G.tt+')→act=tt');G.act=G.tt;}
    // 规则4: to_call不应为负
    if(G.bet<0){corrections.push('bet('+G.bet+')<0→0');G.bet=0;}
    // 规则5: 手牌必须有2张
    var holeCount=G.hole.filter(function(c){return c!==null;}).length;
    if(holeCount!==2){corrections.push('手牌'+holeCount+'张≠2');}
    if(corrections.length>0){console.log('[校验纠错] '+corrections.join('; '));}
  })();
  if(data.my_position){
    var posMap={btn:'btn',button:'btn',co:'co',cutoff:'co',mp:'mp',utg:'utg',sb:'sb',bb:'bb',utg1:'utg',utg2:'utg',mp1:'mp',mp2:'mp',hijack:'mp'};
    G.pos=posMap[(data.my_position||'').toLowerCase()]||'btn';
  }
  
  // 5. 更新筹码/底池/面对下注
  // V2.9.12: 先算BB，再用BB转换pot和stk
  var bbValue=1000; // 默认盲注
  if(data.my_chips>0){
    // 从筹码推算BB（假设100BB初始筹码）
    bbValue=Math.max(100,Math.round(data.my_chips/100));
  }
  if(data.pot_size>0) G.pot=Math.max(1,Math.round(parseInt(data.pot_size)/bbValue));
  if(data.to_call!==undefined) G.bet=parseInt(data.to_call)||0;
  if(data.my_chips>0){
    G.stk=Math.max(5,Math.round(data.my_chips/bbValue));
  }
  
  // V2.9.10: 保存按钮文字
  if(data.buttons && data.buttons.length>0){
    G.buttons=data.buttons;
  } else {
    G.buttons=[];
  }
  
  // 6. 更新UI
  uCards();
  
  // 7. ★ V2.9.12: 确保极速模式始终开启 + 移除loading ★
  document.body.classList.add('speed-mode');
  document.body.classList.remove('api-processing');
  window.scrollTo(0,0);
  
  // 8. 触发策略分析（唯一的go()调用，数据此时已全部就绪）
  // V2.9.13: showAdvice+脉冲动画已移到go()内部异步回调中，确保decide()完成后才执行
  go();
  
  // 10. ★ V2.0: 显示识别结果横幅 ★
  var suitSymbol={s:'♠',h:'♥',d:'♦',c:'♣'};
  var suitColor={s:'blk',h:'red',d:'red',c:'blk'};
  var streetCN={preflop:'翻前',flop:'翻牌',turn:'转牌',river:'河牌',pre:'翻前'};
  
  function makeRecCard(c){
    if(!c||!c.rank) return '';
    var sym=suitSymbol[c.suit]||'?';
    var cls=suitColor[c.suit]||'blk';
    return '<div class="rec-card '+cls+'"><span class="rc-r">'+(c.rank==='T'?'10':c.rank)+'</span><span class="rc-s">'+sym+'</span></div>';
  }
  
  var cardsHtml='';
  // 手牌
  if(data.hole_cards&&data.hole_cards.length>0){
    for(var i=0;i<data.hole_cards.length&&i<2;i++){
      cardsHtml+=makeRecCard(data.hole_cards[i]);
    }
  }
  // 分隔线
  if(data.community_cards&&data.community_cards.length>0&&data.hole_cards&&data.hole_cards.length>0){
    cardsHtml+='<div class="rec-sep"></div>';
  }
  // 公共牌
  if(data.community_cards){
    for(var i=0;i<data.community_cards.length&&i<5;i++){
      cardsHtml+=makeRecCard(data.community_cards[i]);
    }
  }
  
  var recCardsEl=document.getElementById('recCards');
  var recInfoEl=document.getElementById('recInfo');
  var recBannerEl=document.getElementById('recBanner');
  
  if(recCardsEl) recCardsEl.innerHTML=cardsHtml;
  if(recInfoEl){
    var info=(streetCN[data.street]||data.street||'未知阶段');
    if(data.total_players) info+=' | '+data.total_players+'人桌';
    if(data.pot_size>0) info+=' | 底池'+data.pot_size;
    if(data.to_call>0) info+=' | 跟注'+data.to_call;
    recInfoEl.textContent=info;
  }
  if(recBannerEl){
    recBannerEl.classList.add('on');
    // V2.0: 如果有警告，改红色边框
    if(data._warnings&&data._warnings.length>0){
      recBannerEl.style.borderColor='rgba(255,71,87,.6)';
      recBannerEl.style.background='linear-gradient(135deg,#4a0000,#8b0000)';
    } else {
      recBannerEl.style.borderColor='rgba(144,202,249,.3)';
      recBannerEl.style.background='linear-gradient(135deg,#1a237e,#0d47a1)';
    }
  }
}

// 退出极速模式（手动编辑用）
function exitSpeedMode(){
  document.body.classList.remove('speed-mode');
}


// 初始化
DRTA.init();
mkMx();
</script>
