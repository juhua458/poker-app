name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Find APK
      run: |
        echo "=== All APK files ==="
        find . -name "*.apk" -type f
        echo "=== Build output tree ==="
        find app/build/outputs -type f 2>/dev/null || true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.9.127
        name: "V2.9.127 翻前顶级保护扩展——JJ/TT/AK绝不弃牌"
        body: "V2.9.127: 翻前顶级保护扩展。原V2.9.123只覆盖AA/KK/QQ，5-max实战中JJ/TT/AK被EV护栏/对手偏移误降为fold，本版扩展到JJ/TT/AK。AA/KK/QQ/JJ/TT翻前→RAISE_BIG(青绿)，AKs/AKo翻前→RAISE(绿)。V2.9.125/126所有保护点(EV护栏/纠错/池驱反fold)100%保留。E2E 8/8 PASS。"
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
