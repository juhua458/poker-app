name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace 2>&1 | tail -50
        
    - name: Find APK and Upload
      run: |
        echo "=== Searching for APK ==="
        find . -name "*.apk" -type f 2>/dev/null || true
        echo "=== Build outputs ==="
        find app/build/outputs -type f 2>/dev/null || true
        
        APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -z "$APK" ]; then
          echo "WARNING: No APK found via find. Checking standard paths..."
          for p in "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/debug/app-debug-unsigned.apk"; do
            if [ -f "$p" ]; then
              APK="$p"
              break
            fi
          done
        fi
        
        if [ -z "$APK" ]; then
          echo "ERROR: No APK file found anywhere!"
          echo "=== Listing app/build recursively ==="
          ls -laR app/build/ 2>/dev/null | head -100
          exit 1
        fi
        
        echo "Found APK: $APK"
        ls -la "$APK"
        cp "$APK" pokerhelper_v1.2.apk
    
    - name: Upload APK to artifact
      uses: actions/upload-artifact@v4
      with:
        name: poker-v1.2-apk
        path: pokerhelper_v1.2.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2
        name: "V1.2 扑克AI助手 - OCR+语音+信号"
        body: "V1.2: ML Kit OCR筹码识别 + 语音输入牌面 + 颜色信号模式 + 筹码变化追踪"
        files: pokerhelper_v1.2.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
